<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>NightCharge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  color-scheme: dark;
  --bg: #111214; --card: #1b1d21; --fg: #e8e6e1; --dim: #8a8f98;
  --accent: #e8a33d; --ok: #6fbf73; --line: #2a2d33;
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 17px/1.45 -apple-system, system-ui, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  max-width: 480px; margin-inline: auto;
}
.card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
#level { font-size: 96px; font-weight: 700; line-height: 1; text-align: center; padding: 8px 0 4px; }
#level.off { color: var(--dim); }
.sub { text-align: center; color: var(--dim); font-size: 14px; }
#action { font-size: 18px; }
#action.todo { color: var(--accent); font-weight: 600; }
#action.ok { color: var(--ok); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 10px; }
.row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.row:last-child { border-bottom: 0; }
.row .t { color: var(--dim); }
.row .cold { color: var(--accent); }
#hist .row { font-size: 14px; }
#cost { font-size: 15px; color: var(--dim); }
#stale { color: var(--accent); font-size: 14px; text-align: center; margin-bottom: 12px; display: none; }
footer { text-align: center; margin-top: 16px; }
footer a { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<div id="stale"></div>
<div class="card">
  <div id="level">–</div>
  <div class="sub" id="since"></div>
</div>
<div class="card"><div id="action">Loading…</div></div>
<div class="card"><h2>5-day forecast</h2><div id="fc"></div></div>
<div class="card"><h2>Changes this season</h2><div id="hist"><div class="sub">none</div></div></div>
<div class="card" id="costCard" hidden><h2>Cost since season start</h2><div id="cost"></div></div>
<footer><a id="cfgLink" href="settings.html">Settings</a></footer>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
