name: Check forecast

on:
  schedule:
    # Target: evening Europe/Warsaw. Actions cron can be hours late, so we
    # fire early (16:00 UTC = 18:00 CEST, 17:00 UTC = 18:00 CET) and
    # scripts/guard.js accepts any run at or after the configured local hour;
    # check.js skips a duplicate run on the same day.
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Test mode: notify = send a test notification, change = simulate a level change'
        type: choice
        options: ['', 'notify', 'change']
        default: ''

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Is this the right local hour?
        id: guard
        if: github.event_name == 'schedule'
        run: node scripts/guard.js >> "$GITHUB_OUTPUT"

      - name: Check and notify if needed
        if: github.event_name != 'schedule' || steps.guard.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE: ${{ inputs.force }}
        run: node scripts/check.js

      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -sS -H "Title: NightCharge workflow failed" -H "Priority: high" -H "Tags: rotating_light" \
            -d "Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${NTFY_TOPIC}"

      - name: Commit state back to the repo
        if: github.event_name != 'schedule' || steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "state: $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
